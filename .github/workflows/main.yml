name: Build and Push Docker Image
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Load trusted network recovery helpers
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location --connect-timeout 15 --max-time 90 --retry 3 --retry-max-time 180 --retry-connrefused "https://raw.githubusercontent.com/oneclickvirt/securityCheck/main/.github/scripts/ci_network.sh" -o "$RUNNER_TEMP/ci-network.sh"
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Resolve published release
      id: release
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        source "$RUNNER_TEMP/ci-network.sh"
        set -euo pipefail
        tag="$RELEASE_TAG"
        if [[ -z "$tag" ]]; then
          tag=$(curl -fsS --retry 3 --connect-timeout 10 --max-time 120 \
            https://api.github.com/repos/oneclickvirt/securityCheck/releases?per_page=100 | \
            jq -r '[.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // empty')
        fi
        [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        curl -fsS --retry 3 --connect-timeout 10 --max-time 120 \
          "https://api.github.com/repos/oneclickvirt/securityCheck/releases/tags/$tag" > /dev/null
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      with:
        platforms: all
        cache-image: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/security-check:latest
        build-args: SECURITYCHECK_REF=${{ steps.release.outputs.tag }}
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published semantic version tag; empty selects the newest stable version
        required: false
        type: string
env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'
permissions:
  contents: read
