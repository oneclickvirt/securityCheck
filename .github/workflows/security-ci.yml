name: Security CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Repo
        uses: actions/checkout@v7
        with:
          repository: oneclickvirt/security
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run Tests
        run: go test ./... -coverprofile=coverage.txt

      - name: Create Tag
        if: success()
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          TAG="v0.0.9-$(date +'%Y%m%d%H%M%S')"
          echo "TAG=$TAG" >> $GITHUB_ENV
          git tag "$TAG"
          git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}

      - name: Update README.md
        if: success()
        run: |
          sed -i "s|go get github.com/oneclickvirt/security@.*|go get github.com/oneclickvirt/security@${TAG}|" README.md
        env:
          TAG: ${{ env.TAG }}

      - name: Commit and Push README.md
        if: success()
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add README.md
          git commit -m "Update README.md with new tag ${TAG}"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
          TAG: ${{ env.TAG }}
